name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste tokens, app secrets, account IDs or real analytics data.** Redact them first.
        Security problems: use private vulnerability reporting instead (see SECURITY.md).
  - type: input
    id: version
    attributes: {label: "socialledger version (`social --version`)"}
    validations: {required: true}
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [YouTube, Instagram, Facebook, LinkedIn, TikTok, CSV import, Not platform-specific]
  - type: input
    id: os
    attributes: {label: OS and Python version}
  - type: textarea
    id: what
    attributes: {label: What happened, and what did you expect?}
    validations: {required: true}
  - type: textarea
    id: output
    attributes: {label: Redacted command output, render: text}
