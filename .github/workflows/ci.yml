name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # Live tests (tests/live) are skipped unless SOCIALLEDGER_LIVE=1, which CI never sets.
      - run: uv run pytest --cov=socialledger --cov-report=term-missing

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv build
      - name: Smoke-test the built wheel
        shell: bash
        run: |
          uv venv /tmp/wheel-env
          VIRTUAL_ENV=/tmp/wheel-env uv pip install dist/*.whl
          export SOCIALLEDGER_HOME=/tmp/sl-home
          /tmp/wheel-env/bin/social --version
          /tmp/wheel-env/bin/social demo
          /tmp/wheel-env/bin/social report --brand demo-brand --period weekly
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
