[project]
name = "socialledger"
version = "0.1.0.dev0"
description = "Local, read-only reporting, audits and research for your own social media accounts (YouTube, Instagram, Facebook, LinkedIn, TikTok)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "socialledger contributors" }]
keywords = ["social media", "analytics", "youtube", "instagram", "linkedin", "tiktok", "reporting", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "jinja2>=3.1,<4",
    "keyring>=25,<26",
    "typer>=0.12,<1",
    "cryptography>=43",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]

[project.scripts]
social = "socialledger.cli:main"

[project.urls]
Homepage = "https://github.com/prishabanerje-ops/socialledger"
Issues = "https://github.com/prishabanerje-ops/socialledger/issues"
Changelog = "https://github.com/prishabanerje-ops/socialledger/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socialledger"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "socialledger/_defaults"

[tool.hatch.build.targets.sdist]
include = ["src/", "config/", "tests/", "docs/", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["live: hits real platform APIs; opt-in via SOCIALLEDGER_LIVE=1, never in CI"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true
